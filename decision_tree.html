<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoNet Earthquake Classifier - Decision Tree Model</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .header {
            background-color: #2c5282;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        .header p {
            margin: 0.5rem 0 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        #map {
            height: calc(100vh - 200px);
            width: 100%;
            margin: 0;
        }
        .footer {
            background-color: #34495e;
            color: white;
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
        }
        .footer a {
            color: #3498db;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌳 GeoNet Earthquake Classifier - Decision Tree Model</h1>
        <p>
            Real-time earthquake intensity predictions using Decision Tree Model
        </p>
    </div>
    <div id="map"></div>
    <div class="footer">
        <p>Data source:
            <a href="https://www.geonet.org.nz/" target="_blank">
                GeoNet New Zealand</a> |
                Earthquakes from the last 7
                days with magnitude ≥ 3
        </p>
        <p>
            High intensity: Magnitude ≥ 4 |
                Low intensity: Magnitude < 4</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on New Zealand
        var map = L.map('map').setView([-41.2865, 174.7762], 6);

        // Add OpenStreetMap tiles
        L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Earthquake data
        var earthquakes = [{"lat": -39.611995697, "lon": 173.38659668, "magnitude": 3.1708852534185827, "depth": 5.0, "intensity": "Low", "timestamp": "Mon, Nov 16 2026, 09:57:25 AM", "publicid": "2026p863283"}, {"lat": -39.63287735, "lon": 173.396957397, "magnitude": 4.037870322573192, "depth": 5.0, "intensity": "High", "timestamp": "Mon, Nov 16 2026, 09:29:00 AM", "publicid": "2026p863229"}, {"lat": -38.618331909, "lon": 177.810256958, "magnitude": 3.0926257479975505, "depth": 28.60700798034668, "intensity": "Low", "timestamp": "Mon, Nov 16 2026, 09:17:28 AM", "publicid": "2026p863208"}, {"lat": -32.982551575, "lon": -179.924545288, "magnitude": 3.344232769044505, "depth": 432.65374755859375, "intensity": "Low", "timestamp": "Mon, Nov 16 2026, 06:48:09 AM", "publicid": "2026p862930"}, {"lat": -39.850811005, "lon": 174.000167847, "magnitude": 3.6757327081873563, "depth": 152.5474395751953, "intensity": "Low", "timestamp": "Sun, Nov 15 2026, 11:59:38 PM", "publicid": "2026p862161"}, {"lat": 9.76, "lon": 126.2, "magnitude": 6.050048607953866, "depth": 10.0, "intensity": "High", "timestamp": "Sun, Nov 15 2026, 01:41:35 PM", "publicid": "2026p861019"}, {"lat": -26.164714813, "lon": -177.228164673, "magnitude": 4.103624735936022, "depth": 600.0, "intensity": "High", "timestamp": "Sun, Nov 15 2026, 01:19:50 PM", "publicid": "2026p860964"}, {"lat": -20.752271652, "lon": -175.356460571, "magnitude": 5.012524525111033, "depth": 100.0, "intensity": "High", "timestamp": "Sun, Nov 15 2026, 07:36:30 AM", "publicid": "2026p860322"}, {"lat": -36.087795258, "lon": 177.622467041, "magnitude": 3.052083847736673, "depth": 236.4461364746094, "intensity": "Low", "timestamp": "Sun, Nov 15 2026, 06:45:49 AM", "publicid": "2026p860221"}, {"lat": -19.394697189, "lon": -177.508728027, "magnitude": 5.452266271362963, "depth": 478.5237426757812, "intensity": "High", "timestamp": "Sun, Nov 15 2026, 05:14:59 AM", "publicid": "2026p860056"}, {"lat": -45.425064087, "lon": 166.92036438, "magnitude": 3.500580232779803, "depth": 37.9752197265625, "intensity": "Low", "timestamp": "Sat, Nov 14 2026, 11:21:40 PM", "publicid": "2026p859387"}, {"lat": -39.963726044, "lon": 176.279098511, "magnitude": 4.186017295909351, "depth": 20.801843643188477, "intensity": "High", "timestamp": "Sat, Nov 14 2026, 05:51:29 PM", "publicid": "2026p858767"}, {"lat": -33.07856369, "lon": -177.56539917, "magnitude": 4.3424453735266475, "depth": 33.0, "intensity": "High", "timestamp": "Sat, Nov 14 2026, 01:17:17 PM", "publicid": "2026p858254"}, {"lat": -35.096370697, "lon": 178.76260376, "magnitude": 3.826662035012413, "depth": 100.0, "intensity": "Low", "timestamp": "Sat, Nov 14 2026, 02:22:39 AM", "publicid": "2026p857024"}, {"lat": -19.368368149, "lon": -177.68019104, "magnitude": 5.524080614056462, "depth": 600.0, "intensity": "High", "timestamp": "Sat, Nov 14 2026, 02:21:07 AM", "publicid": "2026p857027"}, {"lat": -33.08499527, "lon": -178.288253784, "magnitude": 4.119735743730184, "depth": 100.0, "intensity": "High", "timestamp": "Fri, Nov 13 2026, 10:10:44 PM", "publicid": "2026p856553"}, {"lat": -38.549293518, "lon": 175.456542969, "magnitude": 3.088885440402639, "depth": 155.1593780517578, "intensity": "Low", "timestamp": "Fri, Nov 13 2026, 07:25:36 PM", "publicid": "2026p856241"}, {"lat": -22.920984268, "lon": 179.302505493, "magnitude": 4.756357093717413, "depth": 607.8505859375, "intensity": "High", "timestamp": "Fri, Nov 13 2026, 06:55:38 PM", "publicid": "2026p856190"}, {"lat": -44.536975861, "lon": 168.466110229, "magnitude": 3.159830406789029, "depth": 5.0, "intensity": "Low", "timestamp": "Fri, Nov 13 2026, 06:10:52 PM", "publicid": "2026p856101"}, {"lat": -35.221054077, "lon": 179.627334595, "magnitude": 3.164650675376153, "depth": 211.80499267578125, "intensity": "Low", "timestamp": "Fri, Nov 13 2026, 04:25:53 PM", "publicid": "2026p855904"}, {"lat": -41.376377106, "lon": 179.284759521, "magnitude": 3.2899434390690985, "depth": 33.0, "intensity": "Low", "timestamp": "Fri, Nov 13 2026, 03:09:37 PM", "publicid": "2026p855761"}, {"lat": -34.923744202, "lon": 178.964660645, "magnitude": 3.049038905368447, "depth": 254.49598693847656, "intensity": "Low", "timestamp": "Fri, Nov 13 2026, 01:30:40 PM", "publicid": "2026p855577"}, {"lat": -21.318664551, "lon": -175.010726929, "magnitude": 5.334451138457736, "depth": 139.04727172851562, "intensity": "High", "timestamp": "Fri, Nov 13 2026, 11:18:03 AM", "publicid": "2026p855333"}, {"lat": -32.861278534, "lon": 179.576263428, "magnitude": 3.3625215556848063, "depth": 300.0, "intensity": "Low", "timestamp": "Fri, Nov 13 2026, 03:28:48 AM", "publicid": "2026p854447"}, {"lat": 18.893, "lon": 145.603, "magnitude": 5.014179628133896, "depth": 219.0, "intensity": "High", "timestamp": "Fri, Nov 13 2026, 02:55:03 AM", "publicid": "2026p854400"}, {"lat": -17.944, "lon": -178.052, "magnitude": 4.968434829483472, "depth": 527.0, "intensity": "High", "timestamp": "Fri, Nov 13 2026, 02:26:23 AM", "publicid": "2026p854336"}, {"lat": -2.555143595, "lon": 149.638412476, "magnitude": 6.139962488533963, "depth": 33.0, "intensity": "High", "timestamp": "Thu, Nov 12 2026, 10:04:17 PM", "publicid": "2026p853850"}, {"lat": -33.861614227, "lon": -178.8228302, "magnitude": 3.4215502249056855, "depth": 100.0, "intensity": "Low", "timestamp": "Thu, Nov 12 2026, 04:07:28 PM", "publicid": "2026p853169"}, {"lat": -33.543498993, "lon": 178.927627563, "magnitude": 3.0558946076533355, "depth": 369.1332702636719, "intensity": "Low", "timestamp": "Thu, Nov 12 2026, 10:17:29 AM", "publicid": "2026p852511"}, {"lat": -32.202957153, "lon": 179.12727356, "magnitude": 3.440029322964261, "depth": 300.0, "intensity": "Low", "timestamp": "Thu, Nov 12 2026, 04:15:52 AM", "publicid": "2026p851835"}, {"lat": -21.075149536, "lon": -177.478530884, "magnitude": 4.833291240696479, "depth": 459.770263671875, "intensity": "High", "timestamp": "Wed, Nov 11 2026, 08:38:18 PM", "publicid": "2026p850978"}, {"lat": -24.557508469, "lon": -178.933013916, "magnitude": 4.50399485290015, "depth": 300.0, "intensity": "High", "timestamp": "Wed, Nov 11 2026, 07:50:24 PM", "publicid": "2026p850888"}, {"lat": -5.855448246, "lon": 154.58265686, "magnitude": 5.703397130973233, "depth": 33.0, "intensity": "High", "timestamp": "Wed, Nov 11 2026, 05:38:16 PM", "publicid": "2026p850646"}, {"lat": -32.460739136, "lon": 179.145614624, "magnitude": 3.461811991384413, "depth": 368.2546691894531, "intensity": "Low", "timestamp": "Wed, Nov 11 2026, 11:10:15 AM", "publicid": "2026p849907"}, {"lat": -30.473579407, "lon": 178.059738159, "magnitude": 4.360562624522384, "depth": 300.0, "intensity": "High", "timestamp": "Wed, Nov 11 2026, 02:53:31 AM", "publicid": "2026p848976"}, {"lat": -41.215202332, "lon": 172.522445679, "magnitude": 3.037459847728341, "depth": 191.79141235351562, "intensity": "Low", "timestamp": "Wed, Nov 11 2026, 12:57:54 AM", "publicid": "2026p848757"}, {"lat": -33.371822357, "lon": -177.780517578, "magnitude": 4.16285528841998, "depth": 33.0, "intensity": "High", "timestamp": "Tue, Nov 10 2026, 09:38:28 PM", "publicid": "2026p848385"}, {"lat": -5.194589615, "lon": 147.23576355, "magnitude": 5.475980399473404, "depth": 300.0, "intensity": "High", "timestamp": "Tue, Nov 10 2026, 05:36:39 PM", "publicid": "2026p847941"}, {"lat": -36.826839447, "lon": 179.061172485, "magnitude": 3.0880733598239307, "depth": 5.0, "intensity": "Low", "timestamp": "Tue, Nov 10 2026, 12:00:03 PM", "publicid": "2026p847297"}, {"lat": -10.846658707, "lon": 165.837417603, "magnitude": 5.106350562154482, "depth": 33.0, "intensity": "High", "timestamp": "Tue, Nov 10 2026, 04:30:18 AM", "publicid": "2026p846463"}, {"lat": -11.305321693, "lon": 165.236434937, "magnitude": 5.838117788102249, "depth": 33.0, "intensity": "High", "timestamp": "Tue, Nov 10 2026, 03:37:53 AM", "publicid": "2026p846365"}, {"lat": -24.201345444, "lon": -176.300262451, "magnitude": 4.990077514116949, "depth": 300.0, "intensity": "High", "timestamp": "Mon, Nov 09 2026, 11:45:21 PM", "publicid": "2026p845924"}, {"lat": -23.666820526, "lon": -179.668930054, "magnitude": 5.004755300466614, "depth": 525.7073974609375, "intensity": "High", "timestamp": "Mon, Nov 09 2026, 07:09:47 PM", "publicid": "2026p845406"}];

        // Add markers for each earthquake
        earthquakes.forEach(function(quake) {
            var color = quake.intensity === 'High' ? 'red' : 'green';
            var size = Math.max(5, quake.magnitude * 2);

            var marker = L.circleMarker([quake.lat, quake.lon], {
                radius: size,
                fillColor: color,
                color: color,
                weight: 2,
                opacity: 0.8,
                fillOpacity: 0.6
            }).addTo(map);

            // Create popup with earthquake details
            var popupContent = `
                <div style="font-family: Arial, sans-serif;">
                    <h3 style="margin: 0 0 10px 0; color: #2c5282;">
                        Magnitude ${quake.magnitude}
                    </h3>
                    <p style="margin: 5px 0;"><strong>Intensity:</strong>
                        <span style="color: ${color}; font-weight: bold;">
                            ${quake.intensity}
                        </span>
                    </p>
                    <p style="margin: 5px 0;">
                        <strong>Depth:</strong> ${quake.depth} km
                    </p>
                    <p style="margin: 5px 0;">
                        <strong>Time:</strong> ${quake.timestamp}
                    </p>
                    <p style="margin: 5px 0;"><strong>Location:</strong>
                        ${quake.lat.toFixed(4)}, ${quake.lon.toFixed(4)}
                    </p>
                    <p style="margin: 10px 0 0 0;">
            <a href="${"https://www.geonet.org.nz/earthquake/"}${quake.publicid}"
                           target="_blank"
                           style="color: #3498db; text-decoration: none;">
                            View on GeoNet →
                        </a>
                    </p>
                </div>
            `;

            marker.bindPopup(popupContent);
        });

        // Add legend
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function(map) {
            var div = L.DomUtil.create('div', 'legend');
            div.style.backgroundColor = 'white';
            div.style.padding = '10px';
            div.style.border = '2px solid #ccc';
            div.style.borderRadius = '5px';
            div.innerHTML = `
                <h4 style="margin: 0 0 10px 0;">
                    Intensity (predicted)
                </h4>
                <div style="margin: 5px 0;">
                    <span
                        style="
                            display: inline-block;
                            width: 12px;
                            height: 12px;
                            background-color: red;
                            border-radius: 50%;
                            margin-right: 8px;"
                    ></span>
                    High (Mag >= 4)
                </div>
                <div style="margin: 5px 0;">
                    <span style="
                        display: inline-block;
                        width: 12px;
                        height: 12px;
                        background-color: green;
                        border-radius: 50%;
                        margin-right: 8px;"
                    ></span>
                    Low (Mag < 4)
                </div>
            `;
            return div;
        };
        legend.addTo(map);
    </script>
</body>
