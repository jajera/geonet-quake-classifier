                            width: 12px;
                            height: 12px;
                            background-color: red;
                            border-radius: 50%;
                            margin-right: 8px;"
                    ></span>
                    High (Mag >= 4)
                </div>
                <div style="margin: 5px 0;">
                    <span style="
                        display: inline-block;
                        width: 12px;
                        height: 12px;
                        background-color: green;
                        border-radius: 50%;
                        margin-right: 8px;"
                    ></span>
                    Low (Mag < 4)
                </div>
            `;
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
